name: PostgreSQL adapter

# `workflow_dispatch` also allows a manual run on a selected branch.
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_RS_TEST_POSTGRES_URL: host=localhost port=5432 user=postgres dbname=postgres
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Shared durability contract, PostgreSQL failure boundaries and cost budgets
        run: cargo test --all-features --locked --test storage_conformance --test postgres -- --include-ignored
      - name: PostgreSQL-only workflow
        run: cargo run --no-default-features --features postgres --locked --example postgres_workflow
