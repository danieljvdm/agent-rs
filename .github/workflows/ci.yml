name: Rust
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the checked-in toolchain and includes Cargo dependency/build caching.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: rustc --version && cargo clippy --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: cargo check --no-default-features --locked
      - run: cargo check --no-default-features --features mcp --locked
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --no-default-features --locked
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo bench --bench agent_loop --locked -- --test
      - run: cargo bench --bench model_adapters --locked -- --test
      - run: cargo bench --bench steering_schedule --locked -- --test
      - run: cargo bench --bench attached_subagents --locked -- --test
      - run: cargo bench --features mcp --bench mcp --locked -- --test
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_benchmark.py
      # The personal-agent application, a workspace member the root-package steps above skip.
      - run: cargo fmt -p personal-agent --check
      - run: cargo clippy -p personal-agent --all-targets --locked -- -D warnings
      - run: cargo test -p personal-agent --locked
  # `rust-version` in Cargo.toml is a promise to dependents; build the library on exactly that toolchain.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --all-features --locked
      - run: cargo +1.89 check --no-default-features --locked
  # What `cargo publish` would upload must build on its own, from the packaged files only.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo package -p agent-rs --locked
      # The verification build covers the library only; the packaged examples must compile too.
      - run: cd target/package/agent-rs-*/ && cargo check --all-features --examples
