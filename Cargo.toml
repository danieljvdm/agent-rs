[package]
name = "agent-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A resumable agent engine with an optional SQLite durable host"
license = "MIT"
repository = "https://github.com/danieljvdm/agent-rs"
readme = "README.md"
keywords = ["agent", "llm", "ai", "durable", "tool-calling"]
categories = ["asynchronous"]
# What crates.io receives: the library, its examples, and the two documents the library embeds as
# rustdoc. Tests, benches, scripts and CI stay in the repository, and so do the two examples that
# are benchmark tooling built on `benches/support`.
include = [
    "/src/**",
    "/examples/**",
    "!/examples/benchmark_metrics.rs",
    "!/examples/profile_recovery.rs",
    "/docs/memory.md",
    "/README.md",
    "/LICENSE",
]
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
[workspace]
members = ["apps/personal-agent"]
[features]
default = ["sqlite", "openai"]
sqlite = ["dep:rusqlite"]
# Builds SQLite as SQLCipher, so the SQLite store can encrypt its file with a caller-supplied key.
sqlcipher = ["sqlite", "rusqlite/bundled-sqlcipher"]
openai = ["dep:reqwest"]
memory = []
# Stdio MCP servers as tools. Process groups are signalled through rustix, without unsafe code.
mcp = ["dep:rmcp", "dep:jsonschema", "dep:rustix", "tokio/process", "tokio/io-util", "tokio-util/codec"]
google-calendar = ["dep:reqwest", "dep:chrono", "dep:sha2"]
postgres = ["dep:tokio-postgres"]
# Used only by the repository's `examples/benchmark_metrics.rs` to count allocations; it changes
# nothing in the library.
allocation-metrics = []
[dependencies]
async-trait = "0.1.92"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = "1.0"
# The library spawns tasks and uses timers, channels and select!; it never needs a
# multi-threaded runtime, so dependents choose their own.
tokio = { version = "1.52", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1.20", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
rmcp = { version = "=3.4.0", default-features = false, features = ["client"], optional = true }
jsonschema = { version = "0.30", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.10", optional = true }
# Its default `runtime` feature adds Tokio networking, only when `postgres` is enabled.
tokio-postgres = { version = "0.7.18", optional = true }
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"], optional = true }
[dev-dependencies]
tracing-core = { version = "0.1", default-features = false, features = ["std"] }
criterion = { version = "0.6", features = ["async_tokio"] }
dhat = "0.3.3"
tempfile = "3"
# Statement tracing for SQLite cost guards; `trace` adds no dependencies.
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
libc = "0.2"
# Tests, benches and examples run on multi-threaded runtimes. Paused virtual time makes
# scheduling costs deterministic in tests.
tokio = { version = "1.52", features = ["rt-multi-thread", "test-util"] }
[[example]]
name = "profile_recovery"
required-features = ["sqlite"]
[[example]]
name = "recurring_personal_agent"
required-features = ["sqlite"]
[[example]]
name = "mcp_filesystem"
required-features = ["mcp"]
[[example]]
name = "postgres_workflow"
required-features = ["postgres"]
[[bench]]
name = "agent_loop"
harness = false
[[bench]]
name = "model_adapters"
harness = false
required-features = ["openai"]
[[bench]]
name = "steering_schedule"
harness = false
required-features = ["sqlite"]
[[bench]]
name = "attached_subagents"
harness = false
required-features = ["sqlite"]
[[bench]]
name = "mcp"
harness = false
required-features = ["mcp"]
